</style><rect class="bg" width="720" height="262" rx="12"/><text class="h" x="360" y="38" text-anchor="middle">Install in three steps</text><rect class="card" x="24" y="62" width="212" height="150" rx="12"/><circle class="blue" cx="60" cy="96" r="17"/><text class="bn" x="60" y="102" text-anchor="middle" style="font-size:16px">1</text><text class="t" x="86" y="102">Download</text><text class="s" x="46" y="146">Get the toolbox ZIP</text><text class="s" x="46" y="166">from GitHub Releases</text><path class="arrow" d="M238 137L256 137"/><path class="arrow" d="M256 137l-10 -7M256 137l-10 7"/><rect class="card" x="260" y="62" width="212" height="150" rx="12"/><circle class="blue" cx="296" cy="96" r="17"/><text class="bn" x="296" y="102" text-anchor="middle" style="font-size:16px">2</text><text class="t" x="322" y="102">Install add-ons</text><text class="s" x="282" y="146">Run Install-Addons.ps1</text><text class="s" x="282" y="166">or copy the DLLs by hand</text><path class="arrow" d="M474 137L492 137"/><path class="arrow" d="M492 137l-10 -7M492 137l-10 7"/><rect class="card" x="496" y="62" width="212" height="150" rx="12"/><circle class="blue" cx="532" cy="96" r="17"/><text class="bn" x="532" y="102" text-anchor="middle" style="font-size:16px">3</text><text class="t" x="558" y="102">Install in Rhino</text><text class="s" x="518" y="146">Package Manager:</text><text class="s" x="518" y="166">Nextra-AxisRhinoImport</text><text class="s" x="360" y="244" text-anchor="middle">Then start AxisVM and Rhino. The N. tools appear in the AxisVM add-ons menu.</text></svg>